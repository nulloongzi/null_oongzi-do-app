name: Release AAB

# Play Store 제출용 서명된 릴리즈 번들(AAB)을 빌드한다.
# build-apk.yml 은 폰 사이드로드용 '디버그 APK'만 만든다 → 스토어 제출 불가.
# 이 워크플로는 릴리즈 키스토어(GitHub Secrets)로 서명한 .aab 를 아티팩트로 올린다.
#
# 필요한 Repository Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   - 업로드 키스토어(.jks)를 base64 인코딩한 값
#                               (로컬: `base64 -w0 upload-keystore.jks` / macOS: `base64 -i ...`)
#   ANDROID_KEYSTORE_PASSWORD - storePassword
#   ANDROID_KEY_ALIAS         - keyAlias
#   ANDROID_KEY_PASSWORD      - keyPassword
#
# ⚠️ 기존 Play Store 리스팅을 '업데이트'하려면 반드시 기존 업로드 키(또는 Play App Signing
#    등록분)와 동일한 키로 서명해야 한다. 다른 키 = 같은 리스팅에 올릴 수 없음. (docs/deploy-readiness.md)

on:
  workflow_dispatch: {}

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 시크릿 사전 점검 — 없으면 명확한 메시지로 실패(잘못 서명된 산출물 방지).
      - name: Check signing secrets present
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_* Secrets 가 설정되지 않았습니다. README/deploy-readiness.md 참고."
            exit 1
          fi

      # AGP 8.11 / Gradle 8.14 는 JDK 17 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      # 키스토어 복원 + key.properties 생성 (build.gradle.kts 가 android/key.properties 를 읽음).
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      # 시크릿/키 산출물이 러너에 남지 않도록 정리.
      - name: Clean secrets
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nulloongzido-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
