name: Design tokens

# 디자인 토큰·문구 어긋남 감시. 원본은 웹 저장소 tokens/design-tokens.json 하나이고,
# lib/design_tokens.g.dart 는 거기서 생성한 파일이다. 웹 쪽 생성기로 다시 만들어 보고
# 한 글자라도 다르면 실패한다 → 웹 저장소에서
#   npm run tokens -- --dart ../null_oongzi-do-app/lib/design_tokens.g.dart
# 로 다시 만들어 커밋한다. 규칙: 웹 docs/design-system.md
#
# 웹 저장소는 같은 이름의 브랜치가 있으면 그 브랜치와, 없으면 main 과 비교한다
# (웹·앱을 한 쌍으로 고치는 브랜치끼리 서로 맞춰 볼 수 있게).
# 주 1회 돌려서 웹 main 만 바뀌고 앱이 조용할 때도 잡는다.

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 0 * * 1" # 매주 월 09:17 KST
  workflow_dispatch:

concurrency:
  group: design-tokens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tokens match web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick web branch
        id: web
        run: |
          B="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/nulloongzi/null_oongzi-do.git "$B" >/dev/null; then
            echo "ref=$B" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: nulloongzi/null_oongzi-do
          ref: ${{ steps.web.outputs.ref }}
          path: .web-src

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compare with web tokens (${{ steps.web.outputs.ref }})
        run: node .web-src/scripts/build-tokens.js --check --dart lib/design_tokens.g.dart

      # 알림·입력 오류·확인 팝업 문구가 웹 js/i18n.js 와 같은지(웹 docs/voice-and-tone.md)
      - name: Compare copy with web (${{ steps.web.outputs.ref }})
        run: node .web-src/scripts/check-copy-parity.js --dart lib/l10n/strings.dart
