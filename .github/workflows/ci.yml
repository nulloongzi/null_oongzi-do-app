name: CI

# Phase 1 테스트 게이팅 CI (Flutter 앱).
# 빠른 게이트(analyze + test)를 매 push/PR 에. 무거운 APK 빌드는 build-apk.yml(수동).
# 방법론: docs/testing-methodology.md

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP/Gradle 툴체인은 여기선 불필요하지만 flutter가 JDK를 참조할 수 있어 고정.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - name: Install deps
        run: flutter pub get

      # 티어 0: 정적 분석 — Phase 2 승격: info 포함 전부 게이팅.
      - name: Analyze
        run: flutter analyze --fatal-infos

      # 티어 0: 포맷 하드 게이트 (Phase 2 승격 — 전체 dart format 적용 완료 상태 기준).
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      # 티어 1~3: 순수 유닛 + 서비스(fake Firestore) + 위젯/골든 테스트 게이트.
      - name: Test
        run: flutter test
